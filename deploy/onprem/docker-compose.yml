# On-premises installation: one company, customer-managed server.
# Full guide: deploy/onprem/README.md
#
#   cp .env.onprem.example .env      # then edit it
#   docker compose up -d
#   docker compose exec app php artisan tenant:install
#
# Uses the same image as every other deployment.

name: hr-workforce

x-app: &app
  image: ${APP_IMAGE:-hr-workforce:latest}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - app-storage:/app/storage/app
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: web
      RUN_MIGRATIONS: "true"   # only this service migrates
    ports:
      - "${HTTP_PORT:-8080}:8080"

  worker:
    <<: *app
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hr_workforce}
      MYSQL_USER: ${DB_USERNAME:-hr_workforce}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -e "SELECT 1" "$$MYSQL_DATABASE"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Not published to the host. Uncomment to reach MySQL from the server itself:
    # ports:
    #   - "127.0.0.1:3306:3306"

volumes:
  mysql-data:
  app-storage:
