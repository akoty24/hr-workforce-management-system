# Optional Railway configuration (config-as-code). Nothing in the application
# reads this file; other platforms ignore it. See docs/deployment.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile"

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
